server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Derleme çıktıları içerik hash'i taşıdığı için uzun süre önbelleklenebilir.
  location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # HTML her zaman doğrulansın: yeni sürüm yayınlandığında tarayıcı eski
  # index.html'i (ve dolayısıyla eski JS paketini) göstermesin.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
